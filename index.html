<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐릭터 챗</title>
<style>
:root{--bg:#24252C;--ch:#383C44;--me:#1B1A1E;--tx:#ECEDEF;--sub:#9A9DA6;--ac:#8FA3FF;--ln:#33343C;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--ln);flex:none}
.hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{flex:1;overflow-y:auto;padding:12px 14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ib{font-size:20px;padding:4px 8px}
.pb{background:var(--ac);color:#12131a;font-weight:700;font-size:14px;padding:7px 14px;border-radius:16px}
nav{display:flex;justify-content:space-around;border-top:1px solid #2a2b30;flex:none;background:#17171a;padding:0 14px}
nav button{padding:14px 18px 16px;color:#5F6672;display:flex;align-items:center;justify-content:center}
nav button b{display:flex;height:30px}nav svg{width:30px;height:30px;fill:currentColor;stroke-linejoin:round}
nav button.on{color:#C9CDD6}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--ch);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:var(--ac)}
.av.big{width:96px;height:96px;font-size:32px}.av.sm{width:34px;height:34px;font-size:14px}
.sw{position:relative;margin-bottom:8px;border-radius:14px;overflow:hidden}
.del{position:absolute;right:0;top:0;bottom:0;width:84px;background:#d9534f;color:#fff;font-weight:700}
.row{position:relative;display:flex;gap:12px;align-items:center;padding:12px;background:#2c2e36;touch-action:pan-y;transition:transform .2s;user-select:none}
.row .t{flex:1;min-width:0}.row .n{font-weight:700;display:flex;gap:6px;align-items:center}
.row .p{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.tag{font-size:10px;background:var(--ac);color:#12131a;border-radius:8px;padding:1px 6px;font-weight:700}
.empty{color:var(--sub);text-align:center;margin-top:60px;line-height:1.7;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#2c2e36;border-radius:14px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.card .n{font-weight:700}.card .p{font-size:12px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.add{border:1.5px dashed #4a4d57;background:none;color:var(--ac);justify-content:center;min-height:130px;font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px;max-width:88%}.m.u{align-self:flex-end}
.b{padding:10px 13px;border-radius:16px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word;background:var(--ch)}
.m.u .b{background:var(--me);border:1px solid var(--ln)}
.b i{color:#B9BDC8;font-style:italic}
.nm{font-size:12px;color:var(--sub);margin-bottom:3px}
.bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--ln);flex:none;background:#1f2026}
.bar textarea{flex:1;resize:none;border:0;border-radius:18px;background:var(--ch);color:var(--tx);padding:10px 14px;font:inherit;font-size:15px;max-height:120px;outline:none}
.star{width:40px;height:40px;border-radius:50%;background:var(--ch);font-size:22px;font-weight:700;color:var(--ac);flex:none;line-height:1}
.send{height:40px;padding:0 16px;border-radius:20px;background:var(--ac);color:#12131a;font-weight:700;flex:none}
.send:disabled{opacity:.4}
.form label{display:block;font-size:13px;color:var(--sub);margin-bottom:14px}
.form input,.form textarea{display:block;width:100%;margin-top:6px;background:var(--ch);border:0;border-radius:10px;padding:11px 12px;color:var(--tx);font:inherit;font-size:15px;outline:none;resize:vertical}
.pic{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 18px;cursor:pointer;color:var(--sub);font-size:12px}
.danger{width:100%;padding:12px;border-radius:12px;background:#3a2527;color:#ff8f8a;font-weight:700;margin-top:6px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:5}
.sh{background:#2c2e36;width:100%;border-radius:20px 20px 0 0;padding:20px 18px 24px;max-height:85%;overflow-y:auto}
.sh h3{margin:8px 0 2px}.sh .d{font-size:13px;color:var(--sub);white-space:pre-wrap;line-height:1.55;margin:4px 0 10px}
.sh .top{display:flex;gap:12px;align-items:center}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;padding:12px;border-radius:12px;background:var(--ch);font-weight:700}
.acts .pb{border-radius:12px;font-size:15px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:18px;font-size:13px;z-index:9;max-width:90%;text-align:center}
.seg{display:flex;background:#1b1a1e;border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:8px;border-radius:10px;color:var(--sub);font-weight:700;font-size:14px}.seg button.on{background:var(--ch);color:var(--tx)}
.it{background:#2c2e36;border-radius:18px;margin-bottom:12px;overflow:hidden}.ith{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:700;font-size:17px}.ith span{flex:1}.itb{padding:0 16px 18px;border-top:1px solid var(--ln)}
.fl{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:15px;font-weight:600;color:var(--tx)}.fl em{color:var(--ac);font-style:normal}.tip{font-size:13px;color:var(--sub);font-weight:400;cursor:pointer}
.cnt{font-size:12px;color:var(--sub);text-align:right;margin-top:4px}
.addb{width:100%;padding:16px;border-radius:12px;background:#3a3b42;font-weight:700;font-size:16px;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--ch);border-radius:10px;margin-top:6px;font-size:14px;color:var(--tx)}.chk input{width:18px;height:18px;margin:0;padding:0;display:inline-block;flex:none;accent-color:var(--ac)}
.ref{font-size:11px;color:var(--ac);margin-top:4px}
.mk{display:flex;gap:12px;align-items:center;padding:16px;width:100%;background:var(--ch);border-radius:14px;margin-top:10px;text-align:left;font-weight:700}.mk small{display:block;color:var(--sub);font-weight:400;font-size:12px;margin-top:2px}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>esc(t).replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
const uid=()=>Math.random().toString(36).slice(2,10);
let S={chars:[],pers:[],chats:[],pid:null,books:[],gpt:{on:false,key:'',model:'gpt-4o-mini'}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('zc1')||'{}'))}catch(e){}
const V={lib:'c',tab:'hist',scr:null,id:null,kind:null,edit:null,busy:false};
function save(){try{localStorage.setItem('zc1',JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요. 이미지를 작게 써보세요.')}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;app.appendChild(t);setTimeout(()=>t.remove(),Math.max(2200,m.length*90))}
const av=(img,name,c='')=>img?`<img class="av ${c}" src="${esc(img)}" alt="">`:`<div class="av ${c}">${esc((name||'?')[0])}</div>`;
const getC=id=>S.chars.find(x=>x.id==id),getP=id=>S.pers.find(x=>x.id==id)||{name:'나',desc:'',img:''};
const chat=()=>S.chats.find(x=>x.id==V.id);

function render(){
  if(V.scr==='chat')return chatView();
  if(V.scr==='form')return formView();
  const T={hist:'대화 기록',chars:'캐릭터 · 설정집',me:'나의 프로필'};let h='';
  if(V.tab==='hist'){
    const l=[...S.chats].sort((a,b)=>b.upd-a.upd);
    h=l.length?l.map(c=>{const ch=getC(c.cid),last=c.msgs[c.msgs.length-1];
      return `<div class="sw"><button class="del" data-act="del" data-id="${c.id}">삭제</button><div class="row" data-act="open" data-id="${c.id}">${av(ch?.img,ch?.name)}<div class="t"><div class="n">${esc(ch?.name||'삭제된 캐릭터')}${c.saved?'<span class="tag">저장됨</span>':''}</div><div class="p">${esc(last?last.t.replace(/\*/g,''):'')}</div></div></div></div>`}).join('')
      :`<div class="empty">아직 대화가 없어요.<br>'캐릭터 제작'에서 캐릭터를 만들고<br>대화를 시작해보세요.</div>`;
    h+=l.length?`<div class="empty" style="margin-top:14px;font-size:12px">← 왼쪽으로 밀면 삭제할 수 있어요</div>`:'';
  }else if(V.tab==='chars'){
    h=segHtml()+(V.lib==='b'?bookGrid():`<div class="grid">${S.chars.map(c=>`<div class="card" data-act="sheet" data-id="${c.id}">${av(c.img,c.name,'big')}<div class="n">${esc(c.name)}</div><div class="p">${esc(c.bio)}</div></div>`).join('')}<button class="card add" data-act="new" data-k="c">＋ 새 캐릭터</button></div>`);
  }else{
    h=gptCard()+`<div class="grid">${S.pers.map(p=>`<div class="card" data-act="edit" data-k="p" data-id="${p.id}">${av(p.img,p.name,'big')}<div class="n">${esc(p.name)}${S.pid==p.id?' <span class="tag">사용 중</span>':''}</div><div class="p">${esc(p.desc)}</div>${S.pid==p.id?'':`<button class="pb" data-act="use" data-id="${p.id}">이 프로필 사용</button>`}</div>`).join('')}<button class="card add" data-act="new" data-k="p">＋ 새 프로필</button></div>`;
  }
  app.innerHTML=`<div class="hd"><span>${T[V.tab]}</span></div><div class="sc">${h}</div><nav>${[['chars','<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>','보관함'],['hist','<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.8c0 2.5 1.2 4.7 3.1 6.3-.1 1.3-.6 2.6-1.6 3.7 2 0 3.7-.8 4.9-1.7 1.1.3 2.4.5 3.6.5 5.5 0 10-3.9 10-8.8S17.5 2 12 2z"/><circle cx="7.8" cy="11" r="1.3" fill="#17171a"/><circle cx="12" cy="11" r="1.3" fill="#17171a"/><circle cx="16.2" cy="11" r="1.3" fill="#17171a"/></svg>','대화 기록'],['make','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M12 7v10M7 12h10" stroke="#17171a" stroke-width="2.6" stroke-linecap="round"/></svg>','만들기'],['me','<svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="5"/><path d="M2.5 22c0-4.8 4-7.6 9.5-7.6s9.5 2.800 9.500 7.600z" stroke="currentColor" stroke-width="1.5"/></svg>','내 프로필']].map(t=>`<button class="${V.tab==t[0]?'on':''}" data-act="${t[0]==='make'?'make':'tab'}" data-id="${t[0]}" aria-label="${t[2]}"><b>${t[1]}</b></button>`).join('')}</nav>`;
}

function formView(){if(V.kind==='b')return bookForm();
  const e=V.edit,c=V.kind==='c';
  app.innerHTML=`<div class="hd"><button class="ib" data-act="back">←</button><span>${c?'캐릭터':'프로필'} ${e.isNew?'만들기':'수정'}</span><button class="pb" data-act="fsave">저장</button></div><div class="sc form">
  <div class="pic" data-act="pic">${av(e.img,e.name,'big')}이미지 선택</div>
  <label>이름<input id="f_name" maxlength="30" value="${esc(e.name)}"></label>
  ${c?`<label>프로필 (한 줄 소개)<input id="f_bio" maxlength="60" value="${esc(e.bio)}"></label>
  <label>세계관 상세 설명<textarea id="f_world" rows="5">${esc(e.world)}</textarea></label>
  <label>캐릭터 상세 설명 (성격, 말투, 외모 등)<textarea id="f_desc" rows="6">${esc(e.desc)}</textarea></label>
  <label>첫 인사 (대화 시작 시 캐릭터가 건네는 말)<textarea id="f_greet" rows="3">${esc(e.greet)}</textarea></label>${bookPick(e)}`
  :`<label>상세 설명<textarea id="f_desc" rows="6">${esc(e.desc)}</textarea></label>`}
  ${e.isNew?'':`<button class="danger" data-act="fdel">삭제</button>`}</div>`;
}
function readForm(){if(V.kind==='b'){const n=$('#f_name');if(n)V.edit.name=n.value;return}const e=V.edit,g=i=>$('#'+i)?.value??'';e.name=g('f_name');e.desc=g('f_desc');if(V.kind==='c'){e.bio=g('f_bio');e.world=g('f_world');e.greet=g('f_greet');e.bids=[...document.querySelectorAll('.bk:checked')].map(x=>x.value)}}

function pick(cb){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=320,cv=document.createElement('canvas');cv.width=cv.height=s;const m=Math.min(im.width,im.height),x=(im.width-m)/2,y=(im.height-m)/2;cv.getContext('2d').drawImage(im,x,y,m,m,0,0,s,s);cb(cv.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)};
  i.click();
}

function chatView(){
  const c=chat(),ch=getC(c.cid);
  app.innerHTML=`<div class="hd"><button class="ib" data-act="back">←</button>${av(ch?.img,ch?.name,'sm')}<span>${esc(ch?.name||'삭제된 캐릭터')}<br><small style="color:var(--sub);font-size:11px;font-weight:400">● 대화가 실시간으로 자동 저장돼요</small></span><button class="pb" data-act="csave">저장</button></div>
  <div class="msgs" id="msgs"></div>
  <div class="bar"><textarea id="ta" rows="1" placeholder="메시지 입력  (*행동*)"></textarea><button class="star" id="star" aria-label="별표 입력">*</button><button class="send" id="send">전송</button></div>`;
  drawMsgs();
  const ta=$('#ta');
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'};
  $('#star').onpointerdown=e=>{e.preventDefault();const s=ta.selectionStart,n=ta.selectionEnd;ta.setRangeText('*',s,n,'end');ta.focus()};
  $('#send').onclick=send;
}
function drawMsgs(){
  const c=chat(),ch=getC(c.cid),p=getP(c.pid),b=$('#msgs');
  b.innerHTML=c.msgs.map(m=>m.r==='a'
    ?`<div class="m">${av(ch?.img,ch?.name,'sm')}<div><div class="nm">${esc(ch?.name||'')}</div><div class="b">${fmt(m.t)}</div>${m.refs&&m.refs.length?`<div class="ref">📖 ${esc(m.refs.join(', '))}</div>`:''}</div></div>`
    :`<div class="m u"><div class="b">${fmt(m.t)}</div></div>`).join('');
  b.scrollTop=b.scrollHeight;
}

async function send(){
  if(V.busy)return;const ta=$('#ta'),t=ta.value.trim();if(!t)return;
  const c=chat(),ch=getC(c.cid);if(!ch){toast('삭제된 캐릭터예요');return}
  const p=getP(c.pid);
  c.msgs.push({r:'u',t});c.upd=Date.now();ta.value='';ta.style.height='auto';save();drawMsgs();
  V.busy=true;$('#send').disabled=true;
  const msg={r:'a',t:'…'};c.msgs.push(msg);drawMsgs();
  const scan=c.msgs.slice(-7,-1).map(m=>m.t).join('\n').toLowerCase(),hits=[];
  (ch.bids||[]).forEach(id=>{const b=S.books.find(x=>x.id==id);b&&b.items.forEach(it=>{if(kw(it.keys).some(k=>scan.includes(k.toLowerCase())))hits.push(it)})});
  msg.refs=hits.map(i=>i.title||kw(i.keys)[0]);const lore=hits.length?hits.map(i=>`- ${i.title?'['+i.title+'] ':''}${i.content}`).join('\n'):'(해당 없음)';
  let tl=[],tot=0;for(const m of c.msgs.slice(0,-1).reverse()){const s=`${m.r==='a'?ch.name:p.name}: ${m.t}`;if(tl.length>=250||tot+s.length>70000)break;tl.unshift(s);tot+=s.length}const tr=tl.join('\n');
  const prompt=`당신은 롤플레이 속 캐릭터 "${ch.name}"입니다. 항상 한국어로 답하세요.

[세계관]
${ch.world||'(없음)'}

[캐릭터 설정]
${ch.desc||'(없음)'}

[대화 상대: ${p.name}]
${p.desc||'(없음)'}

[설정집 - 대화 속 키워드와 연결된 확정 설정]
${lore}

규칙: 설정집 내용은 확정된 사실이므로 절대 어기거나 모순되게 쓰지 말고 이야기에 자연스럽게 반영하세요. 행동·표정·상황 묘사는 *별표* 사이에 쓰고, 대사는 그냥 씁니다. ${p.name}의 대사나 행동을 대신 쓰지 마세요. 캐릭터를 벗어나지 말고 2~5문장으로 자연스럽게 답하세요. 설명이나 머리말 없이 답변만 출력하세요.

[지금까지의 대화]
${tr}

위 대화에 이어질 ${ch.name}의 다음 답변만 출력하세요.`;
  try{
    if(S.gpt.on&&S.gpt.key){await gptCall(prompt,msg)}else{const sm=window.claude?await claude.use('sample'):null;
    if(!sm)throw{code:'none'};
    const r=await sm(prompt,{cache:false,onText:({text})=>{msg.t=text||'…';if(V.scr==='chat'&&V.id==c.id){drawMsgs()}}});
    msg.t=(r.text||'').trim()||'(응답이 비어 있어요)';}
  }catch(e){
    c.msgs.pop();
    toast(e.code==='gpt'?'ChatGPT 오류: '+e.m:S.gpt.on&&!e.code?'ChatGPT에 연결하지 못했어요. API 코드와 네트워크를 확인해주세요':e.code==='not_granted'?'AI 응답 권한을 허용해야 대화할 수 있어요':e.code==='rate_limited'?'잠시 후 다시 시도해주세요':'AI 응답을 불러오지 못했어요');
  }
  V.busy=false;c.upd=Date.now();save();
  if(V.scr==='chat'&&V.id==c.id){drawMsgs();const s=$('#send');if(s)s.disabled=false}
}

function newChat(cid){
  const ch=getC(cid),c={id:uid(),cid,pid:S.pid,msgs:ch.greet?[{r:'a',t:ch.greet}]:[],saved:false,upd:Date.now()};
  S.chats.push(c);return c;
}
function openChar(cid){
  let c=S.chats.filter(x=>x.cid==cid&&!x.saved).sort((a,b)=>b.upd-a.upd)[0]||newChat(cid);
  save();V.scr='chat';V.id=c.id;render();
}
function sheet(id){
  const c=getC(id),d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="sh"><div class="top">${av(c.img,c.name,'big')}<div><h3>${esc(c.name)}</h3><div class="d">${esc(c.bio)}</div></div></div>
  ${c.world?`<div class="nm">세계관</div><div class="d">${esc(c.world)}</div>`:''}${c.desc?`<div class="nm">캐릭터</div><div class="d">${esc(c.desc)}</div>`:''}
  <div class="acts"><button class="pb" data-act="start" data-id="${id}">대화 시작</button><button data-act="edit" data-k="c" data-id="${id}">수정</button></div></div>`;
  d.onclick=e=>{if(e.target===d)d.remove()};app.appendChild(d);
}

function leaveChat(){
  const c=chat();
  if(c&&!c.saved&&c.msgs.every(m=>m.r==='a')){S.chats=S.chats.filter(x=>x!==c);save()}
  V.scr=null;render();
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||(sw&&sw.moved))return;
  const a=el.dataset.act,id=el.dataset.id,k=el.dataset.k;
  if(a==='tab'){V.tab=id;render()}
  else if(a==='lib'){V.lib=id;render()}
  else if(a==='make')makeSheet();
  else if(a==='tip')toast('쉼표(,)로 여러 키워드를 입력하세요. 대화에 하나라도 언급되면 아래 내용이 AI에게 전달돼요. (예: 엘리아, 마법사)');
  else if(a==='iadd'){const it=V.edit.items;if(it.length>=50){toast('항목은 최대 50개예요');return}it.forEach(x=>x.open=false);it.push({id:uid(),title:'',keys:'',content:'',open:true});bookForm();$('.sc').scrollTop=1e6}
  else if(a==='itog'){const x=V.edit.items[+id];x.open=!x.open;reB()}
  else if(a==='idel'){if(!confirm('이 항목을 삭제할���요?'))return;V.edit.items.splice(+id,1);reB()}
  else if(a==='open'){V.scr='chat';V.id=id;render()}
  else if(a==='del'){S.chats=S.chats.filter(x=>x.id!=id);save();render()}
  else if(a==='sheet')sheet(id);
  else if(a==='start'){document.querySelector('.ov')?.remove();openChar(id)}
  else if(a==='use'){S.pid=id;save();render()}
  else if(a==='new'||a==='edit'){
    document.querySelector('.ov')?.remove();V.kind=k;
    const src=k==='c'?getC(id):(k==='b'?S.books:S.pers).find(x=>x.id==id);
    V.edit=src?(k==='b'?JSON.parse(JSON.stringify(src)):{...src}):k==='b'?{id:uid(),name:'',items:[{id:uid(),title:'',keys:'',content:'',open:true}],isNew:1}:(k==='c'?{id:uid(),name:'',bio:'',world:'',desc:'',greet:'',img:'',isNew:1}:{id:uid(),name:'',desc:'',img:'',isNew:1});
    V.scr='form';render();
  }
  else if(a==='pic'){readForm();pick(d=>{V.edit.img=d;const y=$('.sc').scrollTop;formView();$('.sc').scrollTop=y})}
  else if(a==='back'){if(V.scr==='chat')leaveChat();else{V.scr=null;render()}}
  else if(a==='fsave'){
    readForm();const x=V.edit;if(!x.name.trim()){toast('이름을 입력해주세요');return}
    if(V.kind==='b'){const its=x.items.filter(i=>i.title||i.keys||i.content);for(const it of its){const k=kw(it.keys);if(!k.length||!it.content.trim()){toast('키워드와 내용은 필수예요');return}if(k.length>5||k.some(y=>y.length>20)){toast('키워드는 각 20자 이내, 최대 5개예요');return}}x.items=its.map(({open,...r})=>r)}
    if(V.kind!=='p'){V.tab='chars';V.lib=V.kind}
    const L=V.kind==='c'?S.chars:V.kind==='b'?S.books:S.pers,isNew=x.isNew;delete x.isNew;
    const i=L.findIndex(y=>y.id==x.id);i>=0?L[i]=x:L.push(x);
    if(V.kind==='p'&&(isNew&&S.pers.length===1||!S.pid))S.pid=x.id;
    save();V.scr=null;render();
  }
  else if(a==='fdel'){
    if(!confirm('정말 삭제할까요?'))return;
    if(V.kind==='b'){S.books=S.books.filter(y=>y.id!=V.edit.id);S.chars.forEach(c=>c.bids=(c.bids||[]).filter(x=>x!=V.edit.id))}else if(V.kind==='c')S.chars=S.chars.filter(y=>y.id!=V.edit.id);
    else{S.pers=S.pers.filter(y=>y.id!=V.edit.id);if(S.pid==V.edit.id)S.pid=S.pers[0]?.id||null}
    save();V.scr=null;render();
  }
  else if(a==='csave'){
    const c=chat();if(c.msgs.every(m=>m.r==='a')){toast('저장할 대화가 없어요');return}
    if(V.busy){toast('답변이 끝난 뒤 저장해주세요');return}
    c.saved=true;c.upd=Date.now();const n=newChat(c.cid);save();V.id=n.id;render();toast('대화를 저장하고 새로 시작했어요');
  }
});

/* 왼쪽으로 밀어 삭제 */
let sw=null;
app.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r)return;sw={r,x:e.clientX,open:r.dataset.o==='1',dx:0,moved:false}});
app.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x;if(Math.abs(dx)>8)sw.moved=true;if(!sw.moved)return;
  sw.dx=dx;sw.r.style.transition='none';sw.r.style.transform=`translateX(${Math.max(-84,Math.min(0,(sw.open?-84:0)+dx))}px)`;
});
function endSw(){
  if(!sw)return;const {r,dx,open,moved}=sw;r.style.transition='';
  if(moved){const o=(open?-84:0)+dx<-42;r.style.transform=o?'translateX(-84px)':'';r.dataset.o=o?'1':'';setTimeout(()=>{sw=null},0)}
  else{if(open){r.style.transform='';r.dataset.o='';sw.moved=true;setTimeout(()=>{sw=null},0)}else sw=null}
}
app.addEventListener('pointerup',endSw);app.addEventListener('pointercancel',endSw);
const kw=s=>String(s||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
const reB=()=>{const y=$('.sc').scrollTop;bookForm();$('.sc').scrollTop=y};
const segHtml=()=>`<div class="seg"><button class="${V.lib!=='b'?'on':''}" data-act="lib" data-id="c">캐릭터</button><button class="${V.lib==='b'?'on':''}" data-act="lib" data-id="b">설정집</button></div>`;
const bookGrid=()=>`<div class="grid">${S.books.map(b=>`<div class="card" data-act="edit" data-k="b" data-id="${b.id}"><div class="av big">📖</div><div class="n">${esc(b.name)}</div><div class="p">항목 ${b.items.length}개</div></div>`).join('')}<button class="card add" data-act="new" data-k="b">＋ 새 설정집</button></div>`;
const bookPick=e=>`<div class="fl">설정집 연동 <span class="tip">키워드가 나오면 AI가 참고해요</span></div>${S.books.length?S.books.map(b=>`<label class="chk"><input type="checkbox" class="bk" value="${b.id}" ${(e.bids||[]).includes(b.id)?'checked':''}>${esc(b.name)} <span class="tip">(항목 ${b.items.length}개)</span></label>`).join(''):'<div class="tip">아직 설정집이 없어요. 아래 ＋ 버튼으로 만들 수 있어요.</div>'}`;
function makeSheet(){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="sh"><h3>무엇을 만들까요?</h3><button class="mk" data-act="new" data-k="c"><span style="font-size:26px">🧑</span><span>캐릭터 만들기<small>이름, 성격, 첫 인사로 캐릭터를 만들어요</small></span></button><button class="mk" data-act="new" data-k="b"><span style="font-size:26px">📖</span><span>설정집 만들기<small>키워드로 연결되는 세계관 설정을 모아요</small></span></button></div>`;d.onclick=e=>{if(e.target===d)d.remove()};app.appendChild(d)}
function bookForm(){const e=V.edit;
  app.innerHTML=`<div class="hd"><button class="ib" data-act="back">←</button><span>설정집 ${e.isNew?'만들기':'수정'}</span><button class="pb" data-act="fsave">저장</button></div><div class="sc form"><label>설정집 이름<input id="f_name" maxlength="30" placeholder="예: 판타지 왕국 세계관" value="${esc(e.name)}"></label>${e.items.map(itemHtml).join('')}<button class="addb" data-act="iadd">＋ 항목 추가 (${e.items.length}/50)</button>${e.isNew?'':'<button class="danger" data-act="fdel">설정집 삭제</button>'}</div>`}
function itemHtml(it,i){const n=kw(it.keys).length;
  return `<div class="it"><div class="ith" data-act="itog" data-id="${i}"><span style="flex:none;width:22px;color:var(--sub)">${it.open?'︿':'﹀'}</span><span>항목${i+1}</span><button class="ib" data-act="idel" data-id="${i}">🗑</button></div>${it.open?`<div class="itb"><div class="fl">제목</div><input data-f="title" data-i="${i}" maxlength="20" placeholder="제목을 입력하세요" value="${esc(it.title)}"><div class="cnt" id="c_t${i}">${it.title.length}/20</div><div class="fl"><span><em>*</em>키워드</span><span class="tip" data-act="tip">❔ Tip</span></div><textarea rows="3" data-f="keys" data-i="${i}" placeholder="키워드를 쉼표(,)로 구분해서 입력해주세요.&#10;입력한 키워드가 언급되면 아래 작성한 내용이 AI에게 전달돼요.">${esc(it.keys)}</textarea><div class="cnt" id="c_k${i}">각 20자 이내, ${n}/5개</div><div class="fl"><span><em>*</em>내용</span></div><textarea rows="5" data-f="content" data-i="${i}" maxlength="500" placeholder="키워드 언급 시 AI에게 전달할 내용을 입력해 주세요.&#10;문장으로 작성시, 무엇에 대한 설명인지 대상을 명시해주세요. (예: '빨갛다' 대신 '사과는 빨갛다')">${esc(it.content)}</textarea><div class="cnt" id="c_c${i}">${it.content.length}/500</div></div>`:''}</div>`}
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const it=V.edit.items[+t.dataset.i],i=t.dataset.i;it[f]=t.value;
  if(f==='keys'){const k=kw(t.value);$('#c_k'+i).textContent=`각 20자 이내, ${k.length}/5개`+(k.length>5||k.some(y=>y.length>20)?' ⚠ 초과':'')}
  else $('#c_'+(f==='title'?'t':'c')+i).textContent=t.value.length+'/'+(f==='title'?20:500)});
const gptCard=()=>`<div class="it" style="padding:16px"><div style="font-weight:700;margin-bottom:4px">ChatGPT 연동</div><div class="tip" style="margin-bottom:8px;cursor:default">API 코드를 입력하면 모든 대화를 ChatGPT가 이어가요. 코드는 이 기기에만 저장돼요.</div><label class="chk"><input type="checkbox" id="g_on" ${S.gpt.on?'checked':''}>ChatGPT로 대화하기</label><div class="form"><input id="g_key" type="password" autocomplete="off" placeholder="OpenAI API 코드 (sk-...)" value="${esc(S.gpt.key)}"><input id="g_model" placeholder="모델 (예: gpt-4o-mini)" value="${esc(S.gpt.model)}"></div></div>`;
document.addEventListener('change',e=>{if(!['g_on','g_key','g_model'].includes(e.target.id))return;S.gpt={on:$('#g_on').checked,key:$('#g_key').value.trim(),model:$('#g_model').value.trim()||'gpt-4o-mini'};if(S.gpt.on&&!S.gpt.key)toast('API 코드를 입력해주세요');save()});
async function gptCall(prompt,msg){const rs=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.gpt.key},body:JSON.stringify({model:S.gpt.model||'gpt-4o-mini',messages:[{role:'user',content:prompt}]})});const j=await rs.json();if(!rs.ok)throw{code:'gpt',m:j.error?.message||rs.status};msg.t=(j.choices?.[0]?.message?.content||'').trim()||'(응답이 비어 있어요)'}

render();
</script></body></html>
